services:
  db:
    image: ${KC_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${KC_POSTGRES_DB}
      POSTGRES_USER: ${KC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
    volumes:
    - db:/var/lib/postgresql
    restart: unless-stopped

  web:
    build: .
    image: ${KC_IMAGE}
    environment:
      SECRET_KEY: ${KC_SECRET_KEY:?set KC_SECRET_KEY (see README) in .env or the environment}
      POSTGRES_HOST: db
      POSTGRES_DB: ${KC_POSTGRES_DB}
      POSTGRES_USER: ${KC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
    volumes:
    - data:/var/lib/artifactorial/
    - ./share/artifactorial.yaml:/etc/artifactorial.yaml:ro
    depends_on:
    - db
    ports:
    - "${KC_FRONT_PORT}:80"
    restart: unless-stopped

volumes:
  db:
    name: artifactorial-db
  data:
    name: artifactorial-data
